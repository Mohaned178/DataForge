name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Running on two operating systems turns the golden-output test into a cross-platform
        # determinism check: both must reproduce the same pinned hashes.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm dataforge generate --scenario scenarios/ecommerce-small.json --seed 42 --out out/ci
      - run: pnpm dataforge verify --run out/ci
      - run: pnpm dataforge chaos plan --run out/ci --profile chaos-profiles/flaky-network.json --chaos-seed 7 --out out/ci-plan
      - run: pnpm dataforge explain --run out/ci --plan out/ci-plan --event evt_ord_000088_2

  integration:
    # The integration suite against the same pinned Kafka broker and PostgreSQL as local development (compose.yaml).
    name: integration (Kafka, PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: docker compose up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - run: pnpm dataforge generate --scenario scenarios/ecommerce-small.json --seed 42 --out out/ci
      - run: pnpm dataforge chaos plan --run out/ci --profile chaos-profiles/spec-example.json --chaos-seed 7 --out out/ci-plan
      - run: pnpm dataforge deliver --run out/ci --plan out/ci-plan --target correct --out out/ci-kafka --transport kafka
      - run: pnpm dataforge validate --run out/ci --actual out/ci-kafka/actual-state.json --plan out/ci-plan
      - run: pnpm db:migrate
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
