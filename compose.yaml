# Local infrastructure for DataForge: one Apache Kafka broker in KRaft mode (no ZooKeeper) and PostgreSQL.
#   docker compose up -d --wait    start both and wait until they are healthy
#   docker compose down            stop both; Kafka keeps nothing, PostgreSQL keeps its volume (run history)
#   docker compose down -v         stop both and also delete the PostgreSQL volume (an empty database)
# KAFKA_HOST_PORT (default 9092) and POSTGRES_HOST_PORT (default 5433) come from the environment or a
# .env file next to this one.
name: dataforge

services:
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # PLAINTEXT is what the host connects to; INTERNAL serves tools run inside the container.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_HOST_PORT:-9092},INTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # DataForge creates every topic itself, with the partition count the execution asks for.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 24
      start_period: 10s

  postgres:
    image: postgres:18.7-alpine
    # 5433 on the host by default: a local PostgreSQL installation usually holds 5432.
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    # Local development credentials only; DATABASE_URL in .env.example matches them.
    environment:
      POSTGRES_USER: dataforge
      POSTGRES_PASSWORD: dataforge
      POSTGRES_DB: dataforge
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataforge -d dataforge"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
